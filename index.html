<script>

(()=>{'use strict';
let canvas=document.getElementById('fluid');
const status=document.getElementById('engine-status');
const size=document.getElementById('size');
const flow=document.getElementById('flow');
const fade=document.getElementById('fade');
const intro=document.getElementById('intro');
const WATER_TOKEN='__WATER__';
let color='#20252a',currentTool='pigment',paused=false,night=false,first=true,lastTime=0;
const pointers=new Map();
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const colorRGB=h=>[1,3,5].map(i=>parseInt(h.substring(i,i+2),16));
const pigmentRGB=h=>colorRGB(h).map(v=>-Math.log(.075+.925*(v/255)));
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),1600)}
// SUMI v0.3.0 — clean engine assembly
// SUMI v0.2.1 — WebGL2, GLSL ES 3.00, semi-Lagrangian incompressible 2D fluid.
// Tuned for more natural sumi-ink pooling, soft capillary edges, and lingering stains.
class GPUFluid {
  constructor(canvas){
    this.canvas=canvas;
    const g=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,
      premultipliedAlpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
    if(!g)throw Error('WebGL2 unavailable');
    if(!g.getExtension('EXT_color_buffer_float'))throw Error('EXT_color_buffer_float unavailable');
    this.g=g;this.canvas=canvas;this.lost=false;this.hadInput=false;this.time=0;this.accum=0;this.activity=0;this.idleTime=0;
    this.programs={};this.targets=[];
    const vertex=`#version 300 es
      precision highp float;
      out vec2 vUv;
      void main(){
        vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);
        vUv=p;
        gl_Position=vec4(p*2.0-1.0,0.0,1.0);
      }`;
    const shared=`#version 300 es
      precision highp float;
      precision highp sampler2D;
      in vec2 vUv;
      out vec4 outColor;
      uniform vec2 uTexel;
      vec4 sampleLinear(sampler2D s, vec2 uv, vec2 res){
        vec2 st=clamp(uv,vec2(0.),vec2(1.))*res-.5;
        vec2 p=floor(st), f=fract(st);
        vec2 a=(p+.5)/res;
        vec2 b=(p+vec2(1.5,.5))/res;
        vec2 c=(p+vec2(.5,1.5))/res;
        vec2 d=(p+1.5)/res;
        return mix(mix(texture(s,clamp(a,vec2(0.),vec2(1.))),texture(s,clamp(b,vec2(0.),vec2(1.))),f.x),
                   mix(texture(s,clamp(c,vec2(0.),vec2(1.))),texture(s,clamp(d,vec2(0.),vec2(1.))),f.x),f.y);
      }
      float hash12(vec2 p){
        vec3 p3=fract(vec3(p.xyx)*.1031);
        p3+=dot(p3,p3.yzx+33.33);
        return fract((p3.x+p3.y)*p3.z);
      }
      float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
    `;
    const fragments={
      copy:`uniform sampler2D uTexture;uniform vec2 uSourceRes;
        void main(){outColor=sampleLinear(uTexture,vUv,uSourceRes);}`,
      advect:`uniform sampler2D uVelocity;uniform sampler2D uSource;
        uniform vec2 uVelRes;uniform vec2 uSrcRes;uniform float uDt;uniform float uDecay;
        void main(){vec2 vel=sampleLinear(uVelocity,vUv,uVelRes).xy;
          vec2 back=clamp(vUv-uDt*vel/uVelRes,vec2(0.),vec2(1.));
          outColor=sampleLinear(uSource,back,uSrcRes)*exp(-uDt*uDecay);
        }`,
      splat:`uniform sampler2D uTexture;uniform vec2 uStart;uniform vec2 uEnd;
        uniform vec2 uScreen;uniform vec2 uImpulse;uniform float uRadius0;
        uniform float uRadius1;uniform float uDose;uniform float uSpeed;
        uniform float uPressure;uniform float uIsVelocity;uniform float uMode;uniform vec3 uPigment;
        void main(){
          vec2 p=(vUv-uStart)*uScreen, segment=(uEnd-uStart)*uScreen;
          float tt=clamp(dot(p,segment)/max(dot(segment,segment),.0001),0.,1.);
          vec2 offset=p-segment*tt;
          float radius=max(1.,mix(uRadius0,uRadius1,tt));
          float ang=atan(offset.y,offset.x);
          float wobble=1.0+.10*sin(ang*5.0+tt*7.0)+.06*cos(ang*11.0-tt*3.7);
          float normalized=length(offset)/max(radius*wobble,1.0);
          float primary=exp(-2.45*normalized*normalized);
          float fringe=exp(-8.0*(normalized-.96)*(normalized-.96))*.17;
          float spray=exp(-1.15*normalized*normalized/2.8)*.10*clamp(uSpeed/1200.,0.,1.);
          float mask=primary+fringe+spray;
          vec4 previous=texture(uTexture,vUv);
          if(uIsVelocity>.5){
            // Tangential stirring from a stationary pointer looked like an endless whirl.
            // Only inject momentum aligned with the actual contact motion.
            float waterBoost=mix(1.0,1.25,step(.5,uMode));
            float wake=(.25+uPressure*.38+clamp(uSpeed/1500.,0.,1.)*.34)*waterBoost;
            outColor=previous+vec4(uImpulse*mask*wake,0.,0.);
          }else if(uMode>.5){
            float diluted=clamp(uDose*(.22+uPressure*.42)*(primary+fringe*.62+spray*.24),0.,.94);
            vec3 blur=(previous.rgb*2.0+
              texture(uTexture,clamp(vUv+vec2(uTexel.x,0.),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv-vec2(uTexel.x,0.),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv+vec2(0.,uTexel.y),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv-vec2(0.,uTexel.y),vec2(0.),vec2(1.))).rgb)/6.0;
            vec3 softened=mix(previous.rgb,blur,diluted*.78)*(1.0-diluted*.58);
            outColor=vec4(max(softened,vec3(0.0)),1.);
          }else{
            float deposited=uDose*(.48+uPressure*.98)*(primary+fringe*.72+spray*.45);
            outColor=vec4(min(previous.rgb+uPigment*deposited,vec3(12.)),1.);
          }
        }`,
      curl:`uniform sampler2D uVelocity;
        void main(){vec2 L=texture(uVelocity,vUv-vec2(uTexel.x,0.)).xy;
          vec2 R=texture(uVelocity,vUv+vec2(uTexel.x,0.)).xy;
          vec2 B=texture(uVelocity,vUv-vec2(0.,uTexel.y)).xy;
          vec2 T=texture(uVelocity,vUv+vec2(0.,uTexel.y)).xy;
          outColor=vec4(.5*(R.y-L.y-T.x+B.x),0.,0.,1.);
        }`,
      vorticity:`uniform sampler2D uVelocity;uniform sampler2D uCurl;
        uniform float uDt;uniform float uSwirl;uniform float uFlow;uniform float uTime;
        void main(){
          float L=abs(texture(uCurl,vUv-vec2(uTexel.x,0.)).x);
          float R=abs(texture(uCurl,vUv+vec2(uTexel.x,0.)).x);
          float B=abs(texture(uCurl,vUv-vec2(0.,uTexel.y)).x);
          float T=abs(texture(uCurl,vUv+vec2(0.,uTexel.y)).x);
          float C=texture(uCurl,vUv).x;
          vec2 N=vec2(T-B,R-L);N/=length(N)+.0001;
          vec2 confinement=vec2(N.x,-N.y)*C*uSwirl;
          // Only a short, activity-scaled disturbance. No permanent background motor.
          vec2 breeze=vec2(sin(vUv.y*13.+uTime*.23)+cos(vUv.x*11.-uTime*.17),
                                 cos(vUv.x*12.-uTime*.21)-sin(vUv.y*10.+uTime*.13))*uFlow*.65;
          vec2 vel=texture(uVelocity,vUv).xy+(confinement+breeze)*uDt;
          outColor=vec4(clamp(vel,vec2(-130.),vec2(130.)),0.,1.);
        }`,
      divergence:`uniform sampler2D uVelocity;
        void main(){
          vec2 C=texture(uVelocity,vUv).xy;
          float L=texture(uVelocity,vUv-vec2(uTexel.x,0.)).x;
          float R=texture(uVelocity,vUv+vec2(uTexel.x,0.)).x;
          float B=texture(uVelocity,vUv-vec2(0.,uTexel.y)).y;
          float T=texture(uVelocity,vUv+vec2(0.,uTexel.y)).y;
          if(vUv.x<uTexel.x)L=-C.x;
          if(vUv.x>1.-uTexel.x)R=-C.x;
          if(vUv.y<uTexel.y)B=-C.y;
          if(vUv.y>1.-uTexel.y)T=-C.y;
          outColor=vec4(.5*(R-L+T-B),0.,0.,1.);
        }`,
      pressure:`uniform sampler2D uPressure;uniform sampler2D uDivergence;
        void main(){
          float L=texture(uPressure,vUv-vec2(uTexel.x,0.)).x;
          float R=texture(uPressure,vUv+vec2(uTexel.x,0.)).x;
          float B=texture(uPressure,vUv-vec2(0.,uTexel.y)).x;
          float T=texture(uPressure,vUv+vec2(0.,uTexel.y)).x;
          float div=texture(uDivergence,vUv).x;
          outColor=vec4((L+R+B+T-div)*.25,0.,0.,1.);
        }`,
      gradient:`uniform sampler2D uPressure;uniform sampler2D uVelocity;
        void main(){
          float L=texture(uPressure,vUv-vec2(uTexel.x,0.)).x;
          float R=texture(uPressure,vUv+vec2(uTexel.x,0.)).x;
          float B=texture(uPressure,vUv-vec2(0.,uTexel.y)).x;
          float T=texture(uPressure,vUv+vec2(0.,uTexel.y)).x;
          vec2 v=texture(uVelocity,vUv).xy-.5*vec2(R-L,T-B);
          if(vUv.x<=uTexel.x || vUv.x>=1.-uTexel.x)v.x=0.;
          if(vUv.y<=uTexel.y || vUv.y>=1.-uTexel.y)v.y=0.;
          outColor=vec4(v,0.,1.);
        }`,
      display:`uniform sampler2D uDye;uniform sampler2D uStain;uniform vec2 uDyeRes;uniform float uDark;uniform float uTime;
        void main(){
          vec3 dye=max(sampleLinear(uDye,vUv,uDyeRes).rgb,vec3(0.));
          vec3 stain=max(sampleLinear(uStain,vUv,uDyeRes).rgb,vec3(0.));
          vec3 total=dye+stain*.82;
          vec3 Ls=max(sampleLinear(uDye,vUv-vec2(uTexel.x,0.),uDyeRes).rgb+sampleLinear(uStain,vUv-vec2(uTexel.x,0.),uDyeRes).rgb*.82,vec3(0.));
          vec3 Rs=max(sampleLinear(uDye,vUv+vec2(uTexel.x,0.),uDyeRes).rgb+sampleLinear(uStain,vUv+vec2(uTexel.x,0.),uDyeRes).rgb*.82,vec3(0.));
          vec3 Bs=max(sampleLinear(uDye,vUv-vec2(0.,uTexel.y),uDyeRes).rgb+sampleLinear(uStain,vUv-vec2(0.,uTexel.y),uDyeRes).rgb*.82,vec3(0.));
          vec3 Ts=max(sampleLinear(uDye,vUv+vec2(0.,uTexel.y),uDyeRes).rgb+sampleLinear(uStain,vUv+vec2(0.,uTexel.y),uDyeRes).rgb*.82,vec3(0.));
          float c=luma(total);
          float gx=luma(Rs)-luma(Ls), gy=luma(Ts)-luma(Bs);
          float grad=length(vec2(gx,gy));
          float halo=smoothstep(.015,.42,c)*(1.0-smoothstep(.42,2.8,c));
          float core=smoothstep(.08,1.7,c);
          float pool=smoothstep(.9,3.8,c);
          float edgeDark=grad*(.85+halo*1.35);
          float grain=.94+.10*hash12(vUv*uDyeRes*1.2+uTime*.04);
          vec3 tint=total/max(total.r+total.g+total.b,.0001);
          tint=mix(vec3(1.),tint,clamp(c*.22,0.,.70));
          vec3 base=mix(vec3(.933,.910,.859),vec3(.064,.102,.137),uDark);
          if(uDark>.5){
            float glow=1.0-exp(-c*.24);
            vec3 warm=vec3(.96,.88,.78)*glow;
            vec3 color=base+warm*(.55+.45*halo);
            color+=vec3(.04,.03,.02)*pool;
            outColor=vec4(clamp(color,0.,1.),1.);

      for(let x=0;x<w;x++){
        const i=yw+x,k=i*3;
        const fx=activeFlow*(2.2*Math.sin(y*.047+this.time*.52)+1.0*Math.cos((y+x)*.026-this.time*.3));
        const fy=activeFlow*(2.0*Math.cos(x*.049-this.time*.47)-1.0*Math.sin((x-y)*.031+this.time*.4));
        const px=clamp(x-(vx[i]+fx)*dt,0,w-1.001);
        const py=clamp(y-(vy[i]+fy)*dt,0,h-1.001);
        const spx=clamp(x-(vx[i]*.30+fx*.55)*dt,0,w-1.001);
        const spy=clamp(y-(vy[i]*.30+fy*.55)*dt,0,h-1.001);
        const x0=px|0,y0=py|0,x1=Math.min(x0+1,w-1),y1=Math.min(y0+1,h-1);
        const sx0=spx|0,sy0=spy|0,sx1=Math.min(sx0+1,w-1),sy1=Math.min(sy0+1,h-1);
        const tx=px-x0,ty=py-y0,t00=1-tx,t01=1-ty;
        const stx=spx-sx0,sty=spy-sy0,s00=1-stx,s01=1-sty;
        const a=y0*w+x0,b=y0*w+x1,c=y1*w+x0,d=y1*w+x1;
        const sa=sy0*w+sx0,sb=sy0*w+sx1,sc=sy1*w+sx0,sd=sy1*w+sx1;
        const wa=t00*t01,wb=tx*t01,wc=t00*ty,wd=tx*ty;
        const swa=s00*s01,swb=stx*s01,swc=s00*sty,swd=stx*sty;
        nvx[i]=(vx[a]*wa+vx[b]*wb+vx[c]*wc+vx[d]*wd)*viscosity;
        nvy[i]=(vy[a]*wa+vy[b]*wb+vy[c]*wc+vy[d]*wd)*viscosity;
        const ak=a*3,bk=b*3,ck=c*3,dk=d*3, sak=sa*3,sbk=sb*3,sck=sc*3,sdk=sd*3;
        for(let channel=0;channel<3;channel++){
          let v=src[ak+channel]*wa+src[bk+channel]*wb+src[ck+channel]*wc+src[dk+channel]*wd;
          const l=x>0?src[k-3+channel]:src[k+channel];
          const r=x<w-1?src[k+3+channel]:src[k+channel];
          const u=y>0?src[k-w*3+channel]:src[k+channel];
          const dd=y<h-1?src[k+w*3+channel]:src[k+channel];
          v+=diffusion*((l+r+u+dd)*.25-v);
          dst[k+channel]=Math.max(0,v*persist);
          let sv=stainSrc[sak+channel]*swa+stainSrc[sbk+channel]*swb+stainSrc[sck+channel]*swc+stainSrc[sdk+channel]*swd;
          const sl=x>0?stainSrc[k-3+channel]:stainSrc[k+channel];
          const sr=x<w-1?stainSrc[k+3+channel]:stainSrc[k+channel];
          const su=y>0?stainSrc[k-w*3+channel]:stainSrc[k+channel];
          const sdv=y<h-1?stainSrc[k+w*3+channel]:stainSrc[k+channel];
          sv+=stainDiffusion*((sl+sr+su+sdv)*.25-sv);
          stainDst[k+channel]=Math.max(0,sv*stainPersist);
        }
      }
    }
    [this.ink,this.inkNext]=[this.inkNext,this.ink];
    [this.stain,this.stainNext]=[this.stainNext,this.stain];
    [this.vx,this.vxNext]=[this.vxNext,this.vx];
    [this.vy,this.vyNext]=[this.vyNext,this.vy];
  }
  draw(){
    const data=this.image.data,ink=this.ink,stain=this.stain,w=this.w,h=this.h;
    const dark=night;
    const base=dark?[16,26,35]:[238,232,219];
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=y*w+x,j=i*3,u=i*4;
        let a=ink[j],b=ink[j+1],c=ink[j+2];
        let sa=stain[j],sb=stain[j+1],sc=stain[j+2];
        if(dark){
          const strength=1-Math.exp(-((a+b+c)+(sa+sb+sc)*.8)*.18);
          data[u]=Math.round(base[0]+(244-base[0])*strength);
          data[u+1]=Math.round(base[1]+(224-base[1])*strength);
          data[u+2]=Math.round(base[2]+(196-base[2])*strength);
          data[u+3]=255;continue;
        }
        const totalA=a+sa*.82,totalB=b+sb*.82,totalC=c+sc*.82;
        const sum=(totalA+totalB+totalC)/3;
        const leftIdx=(y*w+Math.max(0,x-1))*3,rightIdx=(y*w+Math.min(w-1,x+1))*3;
        const upIdx=(Math.max(0,y-1)*w+x)*3,dnIdx=(Math.min(h-1,y+1)*w+x)*3;
        const left=(ink[leftIdx]+ink[leftIdx+1]+ink[leftIdx+2]+(stain[leftIdx]+stain[leftIdx+1]+stain[leftIdx+2])*.82)/3;
        const right=(ink[rightIdx]+ink[rightIdx+1]+ink[rightIdx+2]+(stain[rightIdx]+stain[rightIdx+1]+stain[rightIdx+2])*.82)/3;
        const up=(ink[upIdx]+ink[upIdx+1]+ink[upIdx+2]+(stain[upIdx]+stain[upIdx+1]+stain[upIdx+2])*.82)/3;
        const down=(ink[dnIdx]+ink[dnIdx+1]+ink[dnIdx+2]+(stain[dnIdx]+stain[dnIdx+1]+stain[dnIdx+2])*.82)/3;
        const grad=Math.hypot(right-left,down-up);
        const halo=clamp((sum-.02)/.40,0,1)*clamp((2.7-sum)/2.2,0,1);
        const core=clamp((sum-.08)/1.5,0,1);
        const pool=clamp((sum-.95)/2.8,0,1);
        const absorbR=(totalA*(.78+.46*core)+sa*(.65+.30*halo)+grad*.95);
        const absorbG=(totalB*(.78+.46*core)+sb*(.65+.30*halo)+grad*.95);
        const absorbB=(totalC*(.78+.46*core)+sc*(.65+.30*halo)+grad*.95);
        let r=base[0]*Math.exp(-absorbR*(.95+Math.sin((x*17+y*13+this.time*27))*.02));
        let g=base[1]*Math.exp(-absorbG*(.95+Math.cos((x*11+y*19+this.time*21))*.02));
        let bb=base[2]*Math.exp(-absorbB*(.95+Math.sin((x*7+y*23+this.time*19))*.02));
        const tintSum=Math.max(totalA+totalB+totalC,.0001);
        const tintR=totalA/tintSum,tintG=totalB/tintSum,tintB=totalC/tintSum;
        const featherMix=halo*.32;
        r=r*(1-featherMix)+(base[0]*Math.exp(-(totalA*.46+sa*.60))*((1-.58)+tintR*.58))*featherMix;
        g=g*(1-featherMix)+(base[1]*Math.exp(-(totalB*.46+sb*.60))*((1-.58)+tintG*.58))*featherMix;
        bb=bb*(1-featherMix)+(base[2]*Math.exp(-(totalC*.46+sc*.60))*((1-.58)+tintB*.58))*featherMix;
        r=r*(1-pool*.35)+base[0]*Math.exp(-absorbR*1.18)*(pool*.35);
        g=g*(1-pool*.35)+base[1]*Math.exp(-absorbG*1.18)*(pool*.35);
        bb=bb*(1-pool*.35)+base[2]*Math.exp(-absorbB*1.18)*(pool*.35);
        data[u]=Math.max(0,Math.min(255,Math.round(r)));
        data[u+1]=Math.max(0,Math.min(255,Math.round(g)));
        data[u+2]=Math.max(0,Math.min(255,Math.round(bb)));
        data[u+3]=255;
      }
    }
    this.offCtx.putImageData(this.image,0,0);
    const ctx=this.ctx;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(this.off,0,0,this.canvas.width,this.canvas.height);
  }
  step(dt){
    if(dt<=0)return;
    this.accum=Math.min(.15,this.accum+dt);
    const interval=1/30;
    if(this.accum>=interval){
      const s=Math.min(.052,this.accum);this.accum=0;
      if(this.hadInput)this.advance(s);
      this.draw();
    }
  }
}


let engine=null,activeMode='';
function useCPU(reason){
  console.warn('SUMI WebGL recovery:',reason);
  const fresh=document.createElement('canvas');fresh.id='fluid';fresh.setAttribute('aria-label','터치하여 먹물을 흘리는 캔버스');
  canvas.replaceWith(fresh);canvas=fresh;
  engine=new InkSurface(canvas);activeMode='Canvas2D';status.textContent='Canvas2D · 안전 모드';
  if(reason)toast('GPU 호환 문제: 안전 모드로 전환했습니다');
}
function boot(){
  const candidate=document.createElement('canvas');candidate.id='fluid';
  try{
    const gpu=new GPUFluid(candidate);
    canvas.replaceWith(candidate);canvas=candidate;engine=gpu;activeMode='WebGL2';
    status.textContent='WebGL2 · NAVIER–STOKES';
    canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();if(activeMode==='WebGL2')useCPU('context lost')});
  }catch(err){console.warn('GPU init:',err);useCPU(String(err));}
}
boot();
function safe(action){if(!engine)return;
  try{return action();}catch(err){console.error('SUMI rendering:',err);
    if(activeMode==='WebGL2'){useCPU(String(err));return;}status.textContent='Canvas 렌더링 오류';toast('렌더링 오류가 발생했습니다');}}
const canvasTarget=e=>{
  const t=e.target;
  return t===canvas||t===document.body||t===document.documentElement||!!(t.closest&&t.closest('#grain, .frame, .intro, .vertical, .top'));
};
const showLive=(pressure,speed,toolType)=>{
  const el=document.getElementById('brush-live');
  el.textContent=`${toolType==='pen'?'S펜':'손가락'} · ${toolType==='pen'?'필압 '+Math.round(pressure*100)+'% · ':''}${Math.round(speed)}px/s`;
};
function paint(id,clientX,clientY,begin,pressureValue=.5,time=performance.now(),pointerType='touch'){
  if(!engine)return;
  const rect=canvas.getBoundingClientRect();
  const x=clamp((clientX-rect.left)/Math.max(1,rect.width),0,1);
  const y=clamp((clientY-rect.top)/Math.max(1,rect.height),0,1);
  const prev=pointers.get(id);if(!begin&&!prev)return;
  const pen=pointerType==='pen';
  // Chromium WebView exposes Galaxy S Pen force via PointerEvent.pressure (0...1).
  // Fingers lack calibrated force; use a stable default instead of touch pressure noise.
  const rawPressure=pen?clamp(pressureValue>0?pressureValue:.1,.04,1):.5;
  const prevTime=prev?prev.time:time-16;
  const dt=clamp((time-prevTime)/1000,.006,.10);
  const dx=prev?(x-prev.x)*rect.width:0,dy=prev?(y-prev.y)*rect.height:0;
  const dist=Math.hypot(dx,dy);
  const instantaneous=clamp(dist/dt,0,2400);
  const response=1-Math.exp(-dt/(pen?.028:.045));
  const speed=prev?prev.speed+(instantaneous-prev.speed)*response:0;
  const vx=prev?prev.vx+((dx/dt)-prev.vx)*response:0;
  const vy=prev?prev.vy+((dy/dt)-prev.vy)*response:0;
  const pressure=prev?prev.pressure+(rawPressure-prev.pressure)*Math.min(1,response*1.8):rawPressure;
  const a=prev?{x:prev.x,y:prev.y}:{x,y},b={x,y};
  const brush=Number(size.value);
  // A long coalesced stroke is split spatially; cap samples to avoid saturation.
  safe(()=>{
    if(activeMode==='WebGL2'){
      const n=begin?1:Math.max(1,Math.min(12,Math.ceil(dist/15)));
      for(let i=1;i<=n;i++){
        const t0=(i-1)/n,t1=i/n;
        engine.stroke({x:a.x+(b.x-a.x)*t0,y:a.y+(b.y-a.y)*t0},
          {x:a.x+(b.x-a.x)*t1,y:a.y+(b.y-a.y)*t1},color,brush,begin&&i===1,pressure,speed,dt/n,currentTool);
      }
    }else{
      const n=begin?1:Math.max(1,Math.min(40,Math.ceil(dist/7)));
      for(let i=1;i<=n;i++){
        const f=i/n,sx=a.x+(x-a.x)*f,sy=a.y+(y-a.y)*f;
        engine.drop(sx,sy,(x-a.x)/n,(y-a.y)/n,color,brush,begin&&i===1,pressure,speed,currentTool);
      }
      engine.draw();
    }
  });
  pointers.set(id,{x,y,time,speed,vx,vy,pressure,pointerType});
  showLive(pressure,speed,pointerType);
  if(first){first=false;intro.classList.add('hide')}
}
function finishPointer(id,cancelled=false){
  const prev=pointers.get(id);
  if(!prev)return;
  if(!cancelled)safe(()=>engine.endStroke?.(prev));
  pointers.delete(id);
}
if('PointerEvent' in window){
  document.addEventListener('pointerdown',e=>{
    if(!canvasTarget(e))return;
    // S Pen hover must never leave ink: only contacted pointers start strokes.
    if(e.pointerType==='pen'&&e.buttons===0&&e.pressure===0)return;
    e.preventDefault();paint(e.pointerId,e.clientX,e.clientY,true,e.pressure,e.timeStamp,e.pointerType);
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;e.preventDefault();
    const coalesced=e.getCoalescedEvents?.()||[];
    if(coalesced.length){
      for(const sample of coalesced.slice(-12))
        paint(e.pointerId,sample.clientX,sample.clientY,false,sample.pressure,sample.timeStamp,e.pointerType);
    }else paint(e.pointerId,e.clientX,e.clientY,false,e.pressure,e.timeStamp,e.pointerType);
  },{passive:false});
  document.addEventListener('pointerup',e=>finishPointer(e.pointerId));
  document.addEventListener('pointercancel',e=>finishPointer(e.pointerId,true));
}else{
  document.addEventListener('touchstart',e=>{if(!canvasTarget(e.target))return;e.preventDefault();
    for(const t of e.changedTouches)paint(t.identifier,t.clientX,t.clientY,true,.5,e.timeStamp,'touch');
  },{passive:false});
  document.addEventListener('touchmove',e=>{if(!pointers.size)return;e.preventDefault();
    for(const t of e.changedTouches)paint(t.identifier,t.clientX,t.clientY,false,.5,e.timeStamp,'touch');
  },{passive:false});
  document.addEventListener('touchend',e=>{for(const t of e.changedTouches)finishPointer(t.identifier)});
  document.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)finishPointer(t.identifier,true)});
  let held=false;
  document.addEventListener('mousedown',e=>{if(!canvasTarget(e))return;held=true;paint('mouse',e.clientX,e.clientY,true,.5,e.timeStamp,'mouse')});
  document.addEventListener('mousemove',e=>{if(held)paint('mouse',e.clientX,e.clientY,false,.5,e.timeStamp,'mouse')});
  document.addEventListener('mouseup',()=>{held=false;finishPointer('mouse')});
}
function loop(now){
  const dt=lastTime?clamp((now-lastTime)/1000,0,.06):.016;lastTime=now;
  safe(()=>engine.step(paused?0:dt));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>safe(()=>engine.resize()),220)});
function selectSwatch(el){document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('selected'));
  if(el){el.classList.add('selected');currentTool=el.dataset.tool==='water'?'water':'pigment';color=el.dataset.color||'#20252a';document.getElementById('color-name').textContent=el.dataset.label;}}
document.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>selectSwatch(el)));
document.getElementById('custom-color').addEventListener('input',e=>{
  selectSwatch(null);currentTool='pigment';color=e.target.value;document.getElementById('color-name').textContent='CUSTOM / 직접 선택';
  document.querySelector('.custom').style.background=color;
});
for(const key of ['size','flow','fade'])document.getElementById(key).addEventListener('input',e=>
  document.getElementById(key+'-val').textContent=e.target.value);
document.getElementById('clear').addEventListener('click',()=>safe(()=>{engine.clear();toast('새로운 수면이 펼쳐졌습니다')}));
document.getElementById('pause').addEventListener('click',e=>{
  paused=!paused;e.target.textContent=paused?'계속 재생':'일시정지';toast(paused?'시간이 멈췄습니다':'다시 흐르기 시작합니다');
});
document.getElementById('night').addEventListener('click',e=>{
  night=!night;document.body.classList.toggle('night',night);e.target.textContent=night?'밝은 종이':'어두운 종이';safe(()=>engine.draw());
});
document.getElementById('save').addEventListener('click',async()=>{
  try{
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG encode error');
    if(window.AndroidBridge&&window.AndroidBridge.savePng){
      const reader=new FileReader();reader.onload=()=>window.AndroidBridge.savePng(String(reader.result).split(',')[1]);
      reader.readAsDataURL(blob);toast('이미지를 저장하고 있습니다');return;
    }
    const file=new File([blob],'SUMI.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'SUMI 墨流し'});return;
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;
    a.download='SUMI_'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1600);toast('PNG 저장을 요청했습니다');
  }catch(e){console.error(e);toast('이미지 저장 실패: 화면 캡처를 이용해 주세요');}
});
document.addEventListener('visibilitychange',()=>{lastTime=0});
window.SUMI_DIAGNOSTICS=()=>({engine:activeMode,webgl:activeMode==='WebGL2',version:'0.3.0',tool:currentTool,size:[canvas.width,canvas.height],
  sim:engine&&engine.simW?[engine.simW,engine.simH]:null,brush:[...pointers.values()],hadInput:!!engine?.hadInput,stroke:engine?.lastStroke||null,activity:engine?.activity??0});
})();

</script>
