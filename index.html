<style>

body.night{--paper:#151e25;--ink:#ede9df;--muted:#aeb1b2;--line:rgba(230,228,216,.20);--panel:rgba(32,39,45,.89);--accent:#dc8874}
body.night .frame{border-color:rgba(255,255,255,.13)}body.night .brand small,body.night .top-right,body.night .vertical{color:#c9c4bb}body.night .eyebrow,body.night .right-tag,body.night .ctrl-label,body.night .ctrl-label b,body.night .note{color:#d4d0ca}body.night .action{border-color:#77787a;color:#e8e2dc}body.night .action.primary{background:#d6d0c3;color:#292b2c}

<script>

(()=>{'use strict';
let canvas=document.getElementById('fluid');
const status=document.getElementById('engine-status');
const size=document.getElementById('size');
const flow=document.getElementById('flow');
const fade=document.getElementById('fade');
const intro=document.getElementById('intro');
const WATER_TOKEN='__WATER__';
let inkStyle='fluid',color='#20252a',currentTool='pigment',paused=false,night=false,first=true,lastTime=0;
const pointers=new Map();
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const hash2=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n)};
const noise2=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)};
const fbm2=(x,y,oct=4)=>{let s=0,a=.5,fx=x,fy=y;for(let i=0;i<oct;i++){s+=noise2(fx,fy)*a;fx=fx*2.03+17.13;fy=fy*2.01+9.37;a*=.5}return s};
const colorRGB=h=>[1,3,5].map(i=>parseInt(h.substring(i,i+2),16));
const pigmentRGB=h=>colorRGB(h).map(v=>-Math.log(.075+.925*(v/255)));
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),1600)}
// SUMI v0.5.0 — ink-wash refinement, blooming hold, soft feather edges, paper absorption
// SUMI v0.2.1 — WebGL2, GLSL ES 3.00, semi-Lagrangian incompressible 2D fluid.
// Tuned for more natural sumi-ink pooling, soft capillary edges, and lingering stains.
class GPUFluid {
  constructor(canvas){
    this.canvas=canvas;
    const g=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,
      premultipliedAlpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
    if(!g)throw Error('WebGL2 unavailable');
    if(!g.getExtension('EXT_color_buffer_float'))throw Error('EXT_color_buffer_float unavailable');
    this.g=g;this.canvas=canvas;this.lost=false;this.hadInput=false;this.time=0;this.accum=0;this.activity=0;this.idleTime=0;
    this.programs={};this.targets=[];
    const vertex=`#version 300 es
      precision highp float;
      out vec2 vUv;
      void main(){
        vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);
        vUv=p;
        gl_Position=vec4(p*2.0-1.0,0.0,1.0);
      }`;
    const shared=`#version 300 es
      precision highp float;
      precision highp sampler2D;
      in vec2 vUv;
      out vec4 outColor;
      uniform vec2 uTexel;
      vec4 sampleLinear(sampler2D s, vec2 uv, vec2 res){
        vec2 st=clamp(uv,vec2(0.),vec2(1.))*res-.5;
        vec2 p=floor(st), f=fract(st);
        vec2 a=(p+.5)/res;
        vec2 b=(p+vec2(1.5,.5))/res;
        vec2 c=(p+vec2(.5,1.5))/res;
        vec2 d=(p+1.5)/res;
        return mix(mix(texture(s,clamp(a,vec2(0.),vec2(1.))),texture(s,clamp(b,vec2(0.),vec2(1.))),f.x),
                   mix(texture(s,clamp(c,vec2(0.),vec2(1.))),texture(s,clamp(d,vec2(0.),vec2(1.))),f.x),f.y);
      }
      float hash12(vec2 p){
        vec3 p3=fract(vec3(p.xyx)*.1031);
        p3+=dot(p3,p3.yzx+33.33);
        return fract((p3.x+p3.y)*p3.z);
      }
      float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
    `;
    const fragments={
      copy:`uniform sampler2D uTexture;uniform vec2 uSourceRes;
        void main(){outColor=sampleLinear(uTexture,vUv,uSourceRes);}`,
      advect:`uniform sampler2D uVelocity;uniform sampler2D uSource;
        uniform vec2 uVelRes;uniform vec2 uSrcRes;uniform float uDt;uniform float uDecay;
        void main(){vec2 vel=sampleLinear(uVelocity,vUv,uVelRes).xy;
          vec2 back=clamp(vUv-uDt*vel/uVelRes,vec2(0.),vec2(1.));
          outColor=sampleLinear(uSource,back,uSrcRes)*exp(-uDt*uDecay);
        }`,
      splat:`uniform sampler2D uTexture;uniform vec2 uStart;uniform vec2 uEnd;
        uniform vec2 uScreen;uniform vec2 uImpulse;uniform float uRadius0;
        uniform float uRadius1;uniform float uDose;uniform float uSpeed;
        uniform float uPressure;uniform float uIsVelocity;uniform float uMode;uniform float uRadial;uniform float uStyle;uniform vec3 uPigment;
        void main(){
          vec2 p=(vUv-uStart)*uScreen, segment=(uEnd-uStart)*uScreen;
          float tt=clamp(dot(p,segment)/max(dot(segment,segment),.0001),0.,1.);
          vec2 offset=p-segment*tt;
          float radius=max(1.,mix(uRadius0,uRadius1,tt));
          float ang=atan(offset.y,offset.x);
          float wobble=1.0+.10*sin(ang*5.0+tt*7.0)+.06*cos(ang*11.0-tt*3.7);
          float paperFib=hash12(floor(vUv*uScreen*.70));
          float paperCloud=hash12(floor(vUv*uScreen*.19+vec2(31.4,11.8)));
          float edgeRough=clamp(1.0+.35*(paperCloud-.5)+.43*(paperFib-.5),.65,1.38);
          float normalized=length(offset)/max(radius*wobble*mix(1.0,edgeRough,uStyle),1.0);
          float primary=exp(-2.45*normalized*normalized);
          float fringe=exp(-8.0*(normalized-.96)*(normalized-.96))*.17;
          float spray=exp(-1.15*normalized*normalized/2.8)*.10*clamp(uSpeed/1200.,0.,1.);
          float mask=primary+fringe+spray;
          float brushFibre=clamp(.68+paperFib*.58+paperCloud*.20,0.,1.55);
          float wash=exp(-.92*normalized*normalized)*.25;
          float rimPool=exp(-12.0*(normalized-.92)*(normalized-.92));
          vec4 previous=texture(uTexture,vUv);
          if(uIsVelocity>.5){
            // Tangential stirring from a stationary pointer looked like an endless whirl.
            // Only inject momentum aligned with the actual contact motion.
            float waterBoost=mix(1.0,1.25,step(.5,uMode));
            float wake=(.25+uPressure*.38+clamp(uSpeed/1500.,0.,1.)*.34)*waterBoost;
            // A droplet displaces the local surface radially; moving strokes also drag it.
            // Force is finite, time-scaled, and disappears as soon as contact stops.
            float rr=length(offset)/max(radius,1.);
            float annulus=exp(-2.8*(rr-.72)*(rr-.72))*smoothstep(.03,.22,rr);
            vec2 radial=normalize(offset+vec2(0.0001))*uRadial*annulus;
            outColor=previous+vec4(uImpulse*mask*wake+radial,0.,0.);
          }else if(uMode>.5){
            float diluted=clamp(uDose*(.22+uPressure*.42)*(primary+fringe*.62+spray*.24),0.,.94);
            vec3 blur=(previous.rgb*2.0+
              texture(uTexture,clamp(vUv+vec2(uTexel.x,0.),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv-vec2(uTexel.x,0.),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv+vec2(0.,uTexel.y),vec2(0.),vec2(1.))).rgb+
              texture(uTexture,clamp(vUv-vec2(0.,uTexel.y),vec2(0.),vec2(1.))).rgb)/6.0;
            vec3 softened=mix(previous.rgb,blur,diluted*.78)*(1.0-diluted*.58);
            outColor=vec4(max(softened,vec3(0.0)),1.);
          }else{
            float deposited=uDose*(.48+uPressure*.98)*(primary+fringe*.72+spray*.45);
            // Traditional wash: a dense sumi core, paper-grain gaps and a capillary outer ring.
            if(uStyle>.5){
              float styleStain=clamp((uRadius0/max(radius,1.)-1.0)*1.85,0.,1.0);
              float fibre=brushFibre*(1.0-.25*styleStain);
              float sumiCore=primary*(.70+.30*fibre)+rimPool*(.14+.20*styleStain);
              float sumiWash=wash*(.26+.30*styleStain)*(paperCloud*.5+.75);
              deposited=uDose*(.50+uPressure*.98)*(sumiCore+sumiWash)*(.78+.28*fibre);
            }
            outColor=vec4(min(previous.rgb+uPigment*deposited,vec3(12.)),1.);
          }
        }`,
      diffuse:`uniform sampler2D uTexture;uniform float uBlend;
        void main(){
          vec3 c=texture(uTexture,vUv).rgb;
          vec3 n=(texture(uTexture,vUv+vec2(uTexel.x,0.)).rgb+
                  texture(uTexture,vUv-vec2(uTexel.x,0.)).rgb+
                  texture(uTexture,vUv+vec2(0.,uTexel.y)).rgb+
                  texture(uTexture,vUv-vec2(0.,uTexel.y)).rgb)*.25;
          outColor=vec4(max(mix(c,n,uBlend),vec3(0.)),1.);
        }`,
      capillary:`uniform sampler2D uTexture;uniform float uBlend;
        void main(){
          vec3 c=max(texture(uTexture,vUv).rgb,vec3(0.));
          vec2 pos=vUv/uTexel;
          float seed=hash12(floor(pos*.21));
          float fiber=hash12(floor(pos*.47+vec2(31.7,7.3)));
          vec2 lean=normalize(vec2(.85,.45)+vec2(seed-.5,fiber-.5)*.68);
          vec2 d=normalize(lean+vec2(.0001))*uTexel;
          vec3 along=(max(texture(uTexture,clamp(vUv+d,vec2(0.),vec2(1.))).rgb,vec3(0.))+
            max(texture(uTexture,clamp(vUv-d,vec2(0.),vec2(1.))).rgb,vec3(0.)))*.5;
          vec3 across=(max(texture(uTexture,clamp(vUv+vec2(-d.y,d.x),vec2(0.),vec2(1.))).rgb,vec3(0.))+
            max(texture(uTexture,clamp(vUv-vec2(-d.y,d.x),vec2(0.),vec2(1.))).rgb,vec3(0.)))*.5;
          vec3 target=mix(across,along,.74);
          float capillary=uBlend*(.55+seed*.65);
          outColor=vec4(max(mix(c,target,capillary),vec3(0.)),1.);
        }`,
      curl:`uniform sampler2D uVelocity;
        void main(){vec2 L=texture(uVelocity,vUv-vec2(uTexel.x,0.)).xy;
          vec2 R=texture(uVelocity,vUv+vec2(uTexel.x,0.)).xy;
          vec2 B=texture(uVelocity,vUv-vec2(0.,uTexel.y)).xy;
          vec2 T=texture(uVelocity,vUv+vec2(0.,uTexel.y)).xy;
          outColor=vec4(.5*(R.y-L.y-T.x+B.x),0.,0.,1.);
        }`,
      vorticity:`uniform sampler2D uVelocity;uniform sampler2D uCurl;
        uniform float uDt;uniform float uSwirl;uniform float uFlow;uniform float uTime;

  document.addEventListener('pointerdown',e=>{
    if(!canvasTarget(e))return;
    // S Pen hover must never leave ink: only contacted pointers start strokes.
    if(e.pointerType==='pen'&&e.buttons===0&&e.pressure===0)return;
    e.preventDefault();paint(e.pointerId,e.clientX,e.clientY,true,e.pressure,e.timeStamp,e.pointerType);
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;e.preventDefault();
    const coalesced=e.getCoalescedEvents?.()||[];
    if(coalesced.length){
      for(const sample of coalesced.slice(-12))
        paint(e.pointerId,sample.clientX,sample.clientY,false,sample.pressure,sample.timeStamp,e.pointerType);
    }else paint(e.pointerId,e.clientX,e.clientY,false,e.pressure,e.timeStamp,e.pointerType);
  },{passive:false});
  document.addEventListener('pointerup',e=>finishPointer(e.pointerId));
  document.addEventListener('pointercancel',e=>finishPointer(e.pointerId,true));
}else{
  document.addEventListener('touchstart',e=>{if(!canvasTarget(e.target))return;e.preventDefault();
    for(const t of e.changedTouches)paint(t.identifier,t.clientX,t.clientY,true,.5,e.timeStamp,'touch');
  },{passive:false});
  document.addEventListener('touchmove',e=>{if(!pointers.size)return;e.preventDefault();
    for(const t of e.changedTouches)paint(t.identifier,t.clientX,t.clientY,false,.5,e.timeStamp,'touch');
  },{passive:false});
  document.addEventListener('touchend',e=>{for(const t of e.changedTouches)finishPointer(t.identifier)});
  document.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)finishPointer(t.identifier,true)});
  let held=false;
  document.addEventListener('mousedown',e=>{if(!canvasTarget(e))return;held=true;paint('mouse',e.clientX,e.clientY,true,.5,e.timeStamp,'mouse')});
  document.addEventListener('mousemove',e=>{if(held)paint('mouse',e.clientX,e.clientY,false,.5,e.timeStamp,'mouse')});
  document.addEventListener('mouseup',()=>{held=false;finishPointer('mouse')});
}
function loop(now){
  const dt=lastTime?clamp((now-lastTime)/1000,0,.06):.016;lastTime=now;
  if(!paused){
    // A held pointer is a continuous source; pointermove is not required.
    for(const [id,p] of pointers){
      if(now-p.lastMove<40)continue;
      const elapsed=clamp(dt,.008,.06);
      p.speed*=Math.exp(-elapsed/.09);
      p.vx*=Math.exp(-elapsed/.09);p.vy*=Math.exp(-elapsed/.09);
      p.wetAge=clamp(p.wetAge+elapsed*Math.exp(-p.speed/200),0,3.5);
      p.holdAcc=(p.holdAcc||0)+elapsed;
      if(p.holdAcc>=1/28){
        const doseDt=Math.min(.065,p.holdAcc);p.holdAcc=0;
        safe(()=>{
          const xy={x:p.x,y:p.y};
          if(activeMode==='WebGL2')engine.stroke(xy,xy,color,Number(size.value),false,p.pressure,p.speed,doseDt,currentTool,p.wetAge,true);
          else {engine.drop(p.x,p.y,0,0,color,Number(size.value),false,p.pressure,p.speed,currentTool,p.wetAge,true,doseDt);engine.draw();}
        });
      }
    }
    safe(()=>engine.step(dt));
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>safe(()=>engine.resize()),220)});
function switchInkStyle(next){
  if(next!== 'fluid'&&next!=='sumi')return;
  inkStyle=next;
  document.querySelectorAll('.mode-button').forEach(b=>{
    const selected=b.dataset.inkStyle===next;
    b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));
  });
  const hint=document.getElementById('mode-hint');
  hint.textContent=next==='fluid'?'유체 물감 · 소용돌이와 색상 혼합':'수묵 먹 · 농담·화선지 결·모세관 번짐';
  safe(()=>engine.draw());
}
document.querySelectorAll('.mode-button').forEach(el=>el.addEventListener('click',()=>switchInkStyle(el.dataset.inkStyle)));
function selectSwatch(el){document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('selected'));
  if(el){el.classList.add('selected');currentTool=el.dataset.tool==='water'?'water':'pigment';color=el.dataset.color||'#20252a';document.getElementById('color-name').textContent=el.dataset.label;}}
document.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>selectSwatch(el)));
document.getElementById('custom-color').addEventListener('input',e=>{
  selectSwatch(null);currentTool='pigment';color=e.target.value;document.getElementById('color-name').textContent='CUSTOM / 직접 선택';
  document.querySelector('.custom').style.background=color;
});
for(const key of ['size','flow','fade'])document.getElementById(key).addEventListener('input',e=>
  document.getElementById(key+'-val').textContent=e.target.value);
document.getElementById('clear').addEventListener('click',()=>safe(()=>{engine.clear();toast('새로운 수면이 펼쳐졌습니다')}));
document.getElementById('pause').addEventListener('click',e=>{
  paused=!paused;e.target.textContent=paused?'계속 재생':'일시정지';toast(paused?'시간이 멈췄습니다':'다시 흐르기 시작합니다');
});
document.getElementById('night').addEventListener('click',e=>{
  night=!night;document.body.classList.toggle('night',night);e.target.textContent=night?'밝은 종이':'어두운 종이';safe(()=>engine.draw());
});
document.getElementById('save').addEventListener('click',async()=>{
  try{
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG encode error');
    if(window.AndroidBridge&&window.AndroidBridge.savePng){
      const reader=new FileReader();reader.onload=()=>window.AndroidBridge.savePng(String(reader.result).split(',')[1]);
      reader.readAsDataURL(blob);toast('이미지를 저장하고 있습니다');return;
    }
    const file=new File([blob],'SUMI.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'SUMI 墨流し'});return;
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;
    a.download='SUMI_'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1600);toast('PNG 저장을 요청했습니다');
  }catch(e){console.error(e);toast('이미지 저장 실패: 화면 캡처를 이용해 주세요');}
});
document.addEventListener('visibilitychange',()=>{lastTime=0});
window.SUMI_DIAGNOSTICS=()=>({engine:activeMode,webgl:activeMode==='WebGL2',version:'0.5.0',style:inkStyle,tool:currentTool,size:[canvas.width,canvas.height],
  sim:engine&&engine.simW?[engine.simW,engine.simH]:null,brush:[...pointers.values()],hadInput:!!engine?.hadInput,stroke:engine?.lastStroke||null,activity:engine?.activity??0});
})();

</script>
